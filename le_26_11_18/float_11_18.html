<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .float-left{
            float: left;
        }

        .float-right{
            float: right;
        }

        .clear-both{
            clear: both;
        }

        .box{
            width: 100%;
            height: 25vh;
        }

        .box1{
            width: 100%;
            background-color: #000000;
        }

        .box21{
            width:50%;
            background-color: #0f0000;
        }

        .box22{
            width:50%;
            background-color: #1f0000;
        }

        .box31{
            width:33.33%;
            background-color: #2e0000;
        }

        .box32{
            width:33.33%;
            background-color: #3e0000;
        }

        .box33{
            width:33.33%;
            background-color: #4d0000;
        }

        .box41{
            width:25%;
            background-color: #5d0000;
        }

        .box42{
            width:25%;
            background-color: #6c0000;
        }

        .box43{
            width:25%;
            background-color: #7c0000;
        }

        .box44{
            width:25%;
            background-color: #8b0000;
        }

    </style>


</head>

<body>

    <div class="box box1"></div>

    <div class="clear-both">
        <div class="box box21 float-left"></div>
        <div class="box box22 float-left"></div>
    </div>

    <div class="clear-both">
        <div class="box box31 float-left"></div>
        <div class="box box32 float-left"></div>
        <div class="box box33 float-right"></div>
    </div>

    <div class="clear-both">
        <div class="box box41 float-left"></div>
        <div class="box box42 float-left"></div>
        <div class="box box43 float-left"></div>
        <div class="box box44 float-right"></div>
    </div>


</body>

</html>
