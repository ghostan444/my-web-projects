<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>li-2026｜My Web Projects</title>
    <style>
        /* ===== 顏色和字型都集中在這裡，之後想換風格改這幾行就好 ===== */
        :root {
            --bg: #f6f3ee;          /* 背景色 */
            --card: #ffffff;        /* 卡片底色 */
            --text: #2b2b2b;        /* 主要文字 */
            --muted: #777777;       /* 次要文字 */
            --accent: #b0563f;      /* 強調色（標題、滑過時的顏色） */
            --line: #e4ded4;        /* 邊框線 */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            color: var(--accent);
        }

        header p {
            margin: 4px 0 0;
            color: var(--muted);
        }

        h2 {
            margin: 48px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
            font-size: 1.3rem;
        }

        /* 卡片排列：畫面寬就多排幾欄，手機上自動變一欄 */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            display: block;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
            transition: transform .2s, border-color .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card h3 {
            margin: 0 0 6px;
            font-size: 1.1rem;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: .9rem;
        }

        /* 卡片左上角的小標籤，例如日期 */
        .tag {
            display: inline-block;
            margin-bottom: 8px;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--bg);
            color: var(--accent);
            font-size: .8rem;
        }

        footer {
            margin-top: 64px;
            color: var(--muted);
            font-size: .85rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>

        </header>

        <main>

                </a>
                <a class="card" href="taiwan-band/standalone.html">
                    <h3>台灣樂團探索器</h3>
                    <p>下一團聽什麼？</p>
                </a>
                <a class="card" href="le_26_11_18/radiohead/">
                    <h3>Radiohead</h3>
                    <p>樂團介紹網站</p>
                </a>
                <a class="card" href="calendar_le.html">
                    <h3>月光唱片屋萬年曆</h3>
                    <p>農曆、節氣、節日與小筆記</p>
                </a>
            </div>

            <h2>課堂練習</h2>
            <div class="cards">
                <a class="card" href="le_26_11_17/s20261117_01_bg_position.html">
                    <span class="tag">11/17</span>
                    <h3>背景位置</h3>
                    <p>background-position</p>
                </a>
                <a class="card" href="le_26_11_17/s20261117_02_one.html">
                    <span class="tag">11/17</span>
                    <h3>ONE 頁面</h3>
                </a>
                <a class="card" href="le_26_11_18/float_11_18.html">
                    <span class="tag">11/18</span>
                    <h3>浮動排版</h3>
                    <p>float</p>
                </a>
            </div>
        </main>

        <footer>© 2026 ghostan444</footer>
    </div>
</body>

</html>
