<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 294px;
            height: 405px;
            background-color: rgb(0, 0, 0);

            background-repeat: no-repeat;
        }

        .box1 {
            background-image: url('./images/one.png');
        }

        .box2 {
            background-image: url('./images/one.png');

            background-position: -670px 0px;
        }

        .box3 {
            background-image: url('./images/one.png');

            background-position: -340px 0px;
        }

        .box4 {
            background-image: url('./images/one.png');

            background-position: -661px -421px;
        }

        .box5 {
            background-image: url('./images/one.png');

            background-position: -6px -420px;
        }

        .box6 {
            background-image: url('./images/one.png');

            background-position: -340px -418px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 294px);
            gap: 20px;
            justify-content: center;
        }

        .logo {
            display: block;
            width: 260px;
            max-width: 90%;
            margin: 0 auto 0px;
        }
    </style>
</head>

<body>
    <img class="logo" src="./images/one_logo.jpg" alt="ONE PIECE logo">
    <div class="gallery">
    <div class="box box1">

    </div>

        <div class="box box2">

    </div>

        <div class="box box3">

    </div>

        <div class="box box4">

    </div>

        <div class="box box5">

    </div>

        <div class="box box6">

    </div>

    </div>

</body>

</html>
